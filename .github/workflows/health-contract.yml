name: Harness health contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  health-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -p test_health_adapter.py -v
