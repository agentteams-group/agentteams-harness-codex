name: Build Codex Harness image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Independent image version
        required: true
        default: v0.1.0
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/AgentTeams
          ref: 41ef2358abc2af7519356d1cd5b9f72392f70af6
          path: at-input
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: at=./at-input
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/agentteams-group/agentteams-harness-codex:${{ inputs.version || github.ref_name }}
